<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>新闻表单</title><link rel="stylesheet" href="/static/styles/app.css"></head><body><main><p><a href="/admin/news">返回后台新闻列表</a></p><h1>新闻表单</h1>{{if .Error}}<p style="color:red">{{.Error}}</p>{{end}}<form method="post" action="{{.Action}}"><label>标题 <input name="title" value="{{.Title}}"></label><br><label>Slug <input name="slug" value="{{.Slug}}"></label><br><label>摘要 <textarea name="summary">{{.Summary}}</textarea></label><br><label>内容 <textarea name="content" rows="10">{{.Content}}</textarea></label><br><label>状态 <select name="status"><option value="draft">草稿</option><option value="published"{{if eq .Status "published"}} selected{{end}}>已发布</option></select></label><br><button type="submit">保存</button></form></main><script src="/static/scripts/app.js"></script></body></html>
