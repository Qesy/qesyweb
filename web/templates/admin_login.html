<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{call .T "admin.login.title"}}</title><link rel="stylesheet" href="/static/styles/app.css"></head><body><main><h1>{{call .T "admin.login.title"}}</h1>{{if .Error}}<p style="color:red">{{.Error}}</p>{{end}}<form method="post" action="/admin/login"><p><label>{{call .T "admin.login.username"}} <input name="username" value="{{.Username}}" autocomplete="username"></label></p><p><label>{{call .T "admin.login.password"}} <input name="password" type="password" autocomplete="current-password"></label></p><p><label>{{call .T "admin.login.captcha"}} <input name="captcha" autocomplete="off"></label><br><img src="/admin/captcha" alt="captcha" onclick="this.src='/admin/captcha?x='+Date.now()"></p><button type="submit">{{call .T "admin.login.submit"}}</button></form><p><a href="/admin/login?lang=en-US">English</a> | <a href="/admin/login?lang=zh-CN">中文</a></p></main><script src="/static/scripts/app.js"></script></body></html>
